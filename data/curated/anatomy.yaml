# Hand-curated anatomy of the whole body, read by stage enrichAnatomy (pipeline/enrich_anatomy.py,
# whose docstring defines every field and the checks it runs).
#
# Keys are node keys: the graph id is `<kind>:<key>`, e.g. `muscle:glmed1_r`. A key ending in
# `_r` is a right-side node and every other key is a midline node; this file holds the right side
# and the midline, and the left side comes from code (`enrich_anatomy.with_left` mirrors every
# right entry into its `_l` twin, so each fact lives once).
# `name` is the anatomical name, `commonName` the everyday name.
# `ontologyName` (optional) is the term looked up in Uberon and FMA when it differs from
# `name`; `fmaName` (optional) overrides it for FMA alone, and may name the side itself where
# FMA puts it mid-label (e.g. "long head of right biceps femoris"). A muscle modelled as several
# lines of action (e.g. gluteus medius 1-3, the FBLS fascicles of multifidus) carries the
# ontology ids of the whole muscle, and a group per named muscle gathers its lines of action.
# Sources for attachments and innervation: standard anatomy texts (Gray's Anatomy, 42nd ed.;
# Moore, Clinically Oriented Anatomy, 8th ed.); the OpenSim bodies of each muscle path come
# from the model (model.json), and an `origin` / `insertion` here refines the bone within the
# model's body. The merged model's trunk muscles come from FBLS (Raabe & Chaudhari 2016), the
# arm muscles from Holzbaur 2005 and the neck muscles from Mortensen 2018
# (pipeline/config/model.yaml); their names, path bodies and the fascicle levels in the
# names below follow those models.

movement:
  walking: {name: walking, commonName: walking}

phases:
  loadingResponse: {name: loading response, commonName: weight acceptance}
  midStance: {name: mid-stance, commonName: single-leg support}
  terminalStance: {name: terminal stance, commonName: heel rise}
  preSwing: {name: pre-swing, commonName: push-off}
  initialSwing: {name: initial swing, commonName: foot lift}
  midSwing: {name: mid-swing, commonName: leg swing}
  terminalSwing: {name: terminal swing, commonName: reaching for the next step}

# Bones, each with the OpenSim body it belongs to.
bones:
  pelvis: {name: pelvis, commonName: hip bones, body: pelvis, extraBodies: [Abdomen], ontologyName: bony pelvis}
  femur_r: {name: femur, commonName: thigh bone, body: femur_r}
  patella_r: {name: patella, commonName: kneecap, body: patella_r}
  tibia_r: {name: tibia, commonName: shin bone, body: tibia_r}
  fibula_r: {name: fibula, commonName: calf bone, body: tibia_r}
  talus_r: {name: talus, commonName: ankle bone, body: talus_r}
  calcaneus_r: {name: calcaneus, commonName: heel bone, body: calcn_r}
  navicular_r: {name: navicular bone, commonName: midfoot bone, body: calcn_r, ontologyName: navicular bone of pes, fmaName: navicular bone of right foot}
  medial_cuneiform_r: {name: medial cuneiform bone, commonName: inner midfoot bone, body: calcn_r, ontologyName: medial cuneiform bone, fmaName: medial cuneiform bone}
  metatarsal1_r: {name: first metatarsal bone, commonName: big-toe foot bone, body: calcn_r, ontologyName: metatarsal bone of digit 1, fmaName: first metatarsal bone}
  metatarsal5_r: {name: fifth metatarsal bone, commonName: little-toe foot bone, body: calcn_r, ontologyName: metatarsal bone of digit 5, fmaName: fifth metatarsal bone}
  phalanges_r: {name: phalanges of the foot, commonName: toe bones, body: toes_r, ontologyName: phalanx of pes, fmaName: set of phalanges of right foot}
  # Trunk. The lumbar vertebrae are FBLS bodies; Rajagopal's torso body carries the thoracic
  # spine, rib cage, sternum and shoulder girdle; FBLS's Abdomen body carries the abdominal wall
  # (linea alba and rectus sheath, from the rib cage to the pubic bones), so the pelvis and the
  # rib cage list it in `extraBodies`.
  sacrum: {name: sacrum, commonName: tailbone base, body: pelvis}
  l5: {name: fifth lumbar vertebra, commonName: L5, body: lumbar5}
  l4: {name: fourth lumbar vertebra, commonName: L4, body: lumbar4}
  l3: {name: third lumbar vertebra, commonName: L3, body: lumbar3}
  l2: {name: second lumbar vertebra, commonName: L2, body: lumbar2}
  l1: {name: first lumbar vertebra, commonName: L1, body: lumbar1}
  thoracicSpine: {name: thoracic vertebral column, commonName: upper back spine, body: torso}
  ribCage: {name: rib cage, commonName: ribs, body: torso, extraBodies: [Abdomen]}
  sternum: {name: sternum, commonName: breastbone, body: torso}
  clavicle_r: {name: clavicle, commonName: collarbone, body: torso}
  scapula_r: {name: scapula, commonName: shoulder blade, body: torso}
  # Neck and head: Mortensen's cervical vertebrae, and the head body with skull and jaw.
  c7: {name: seventh cervical vertebra, commonName: C7, body: cerv7}
  c6: {name: sixth cervical vertebra, commonName: C6, body: cerv6}
  c5: {name: fifth cervical vertebra, commonName: C5, body: cerv5}
  c4: {name: fourth cervical vertebra, commonName: C4, body: cerv4}
  c3: {name: third cervical vertebra, commonName: C3, body: cerv3}
  axis: {name: axis, commonName: C2, body: cerv2}
  atlas: {name: atlas, commonName: C1, body: cerv1}
  hyoid: {name: hyoid bone, commonName: tongue bone, body: cerv3, extraBodies: [cerv1]}
  skull: {name: skull, commonName: skull, body: head}
  mandible: {name: mandible, commonName: jaw, body: head}
  # Arm.
  humerus_r: {name: humerus, commonName: upper-arm bone, body: humerus_r}
  ulna_r: {name: ulna, commonName: inner forearm bone, body: ulna_r}
  radius_r: {name: radius, commonName: outer forearm bone, body: radius_r}
  carpals_r: {name: carpal bones, commonName: wrist bones, body: hand_r, ontologyName: carpal bone, fmaName: set of carpal bones of right hand}
  metacarpals_r: {name: metacarpal bones, commonName: palm bones, body: hand_r, ontologyName: metacarpal bone, fmaName: set of metacarpal bones of right hand}
  handPhalanges_r: {name: phalanges of the hand, commonName: finger bones, body: hand_r, ontologyName: phalanx of manus, fmaName: set of phalanges of right hand}

# OpenSim body -> the bone a muscle attaches to when its path ends on that body and the muscle
# names no `origin` / `insertion` of its own.
bodies:
  pelvis: pelvis
  lumbar5: l5
  lumbar4: l4
  lumbar3: l3
  lumbar2: l2
  lumbar1: l1
  Abdomen: pelvis
  torso: thoracicSpine
  cerv7: c7
  cerv6: c6
  cerv5: c5
  cerv4: c4
  cerv3: c3
  cerv2: axis
  cerv1: atlas
  head: skull
  humerus_r: humerus_r
  ulna_r: ulna_r
  radius_r: radius_r
  hand_r: metacarpals_r
  femur_r: femur_r
  patella_r: patella_r
  tibia_r: tibia_r
  talus_r: talus_r
  calcn_r: calcaneus_r
  toes_r: phalanges_r

# OpenSim body, side suffix `_r` / `_l` dropped -> body region (schema `Region`). Bones take
# the region of their body, joints that of their first model joint's child body, muscles that
# of their insertion bone (pipeline/enrich_anatomy.py `regions_of`).
regions:
  pelvis: pelvis
  femur: lowerLimb
  patella: lowerLimb
  tibia: lowerLimb
  talus: lowerLimb
  calcn: lowerLimb
  toes: lowerLimb
  torso: trunk
  head: head
  humerus: upperLimb
  ulna: upperLimb
  radius: upperLimb
  hand: upperLimb
  # Bodies the model merge adds (pipeline/config/model.yaml): FBLS lumbar vertebrae and their
  # two wrapping bodies, Mortensen cervical vertebrae (the neck rides with the head region).
  lumbar1: trunk
  lumbar2: trunk
  lumbar3: trunk
  lumbar4: trunk
  lumbar5: trunk
  Abdomen: trunk
  LB_wrap: trunk
  cerv1: head
  cerv2: head
  cerv3: head
  cerv4: head
  cerv5: head
  cerv6: head
  cerv7: head

# Joints: `opensim` lists the model joints (the first names the node); `articulates` lists
# bones, each of which belongs to a parent or child body of those model joints.
joints:
  hip_r: {name: hip joint, commonName: hip, opensim: [hip_r], articulates: [pelvis, femur_r]}
  knee_r: {name: knee joint, commonName: knee, opensim: [walker_knee_r, patellofemoral_r], articulates: [femur_r, tibia_r, patella_r]}
  ankle_r: {name: ankle joint, commonName: ankle, opensim: [ankle_r], articulates: [tibia_r, fibula_r, talus_r]}
  subtalar_r: {name: subtalar joint, commonName: heel joint, opensim: [subtalar_r], articulates: [talus_r, calcaneus_r]}
  mtp_r: {name: metatarsophalangeal joints, commonName: ball of the foot, opensim: [mtp_r], articulates: [metatarsal1_r, metatarsal5_r, phalanges_r], ontologyName: metatarsophalangeal joint}
  # The spine: FBLS's lumbar chain (one coordinate per axis, shared out over the five joints),
  # and Mortensen's neck in two groups of coupled joints, C7-T1 to C2-C3 and the head on C2.
  lumbarSpine: {name: joints of the lumbar vertebral column, commonName: lower back, opensim: [L5_S1_IVDjnt, L4_L5_IVDjnt, L3_L4_IVDjnt, L2_L3_IVD_jnt, L1_L2_IVD_jnt, Torsojnt], articulates: [sacrum, l5, l4, l3, l2, l1, thoracicSpine], ontologyName: intervertebral joint, fmaName: joint of lumbar vertebral column}
  cervicalSpine: {name: joints of the cervical vertebral column, commonName: neck, opensim: [auxt1jnt, aux7jnt, aux6jnt, aux5jnt, aux4jnt, aux3jnt], articulates: [thoracicSpine, c7, c6, c5, c4, c3, axis], ontologyName: intervertebral joint, fmaName: joint of cervical vertebral column}
  craniovertebral: {name: craniovertebral joints, commonName: head on neck, opensim: [aux2jnt, aux1jnt], articulates: [axis, atlas, skull], ontologyName: craniovertebral joint}
  # The arm.
  shoulder_r: {name: glenohumeral joint, commonName: shoulder, opensim: [acromial_r], articulates: [scapula_r, humerus_r]}
  elbow_r: {name: elbow joint, commonName: elbow, opensim: [elbow_r], articulates: [humerus_r, ulna_r]}
  radioulnar_r: {name: radio-ulnar joints, commonName: forearm rotation, opensim: [radioulnar_r], articulates: [ulna_r, radius_r], ontologyName: radio-ulnar joint}
  wrist_r: {name: wrist joint, commonName: wrist, opensim: [radius_hand_r], articulates: [radius_r, carpals_r]}

# Model coordinate -> its joint and the joint action of each direction (OpenSim signs). A
# coordinate without a side suffix sits on the midline and takes the muscles of both sides
# (pipeline/label_roles.py `muscles_of`). Signs, from the model's moment arms: lumbar and neck
# extension positive, bending to the right positive, rotation to the left positive; shoulder
# flexion, adduction and internal rotation positive; elbow flexion, forearm pronation, wrist
# flexion and ulnar deviation positive.
coordinates:
  hip_flexion_r: {joint: hip_r, positive: hip_flexion_r, negative: hip_extension_r}
  hip_adduction_r: {joint: hip_r, positive: hip_adduction_r, negative: hip_abduction_r}
  hip_rotation_r: {joint: hip_r, positive: hip_internal_rotation_r, negative: hip_external_rotation_r}
  knee_angle_r: {joint: knee_r, positive: knee_flexion_r, negative: knee_extension_r}
  ankle_angle_r: {joint: ankle_r, positive: ankle_dorsiflexion_r, negative: ankle_plantarflexion_r}
  lumbar_extension: {joint: lumbarSpine, positive: lumbar_extension, negative: lumbar_flexion}
  lumbar_bending: {joint: lumbarSpine, positive: lumbar_right_bending, negative: lumbar_left_bending}
  lumbar_rotation: {joint: lumbarSpine, positive: lumbar_left_rotation, negative: lumbar_right_rotation}
  # Neck angles rest on decision D-010: the head holds its standing orientation in space.
  neck_lower_extension: {joint: cervicalSpine, positive: neck_extension, negative: neck_flexion}
  neck_lower_bending: {joint: cervicalSpine, positive: neck_right_bending, negative: neck_left_bending}
  neck_lower_rotation: {joint: cervicalSpine, positive: neck_left_rotation, negative: neck_right_rotation}
  neck_upper_extension: {joint: craniovertebral, positive: head_extension, negative: head_flexion}
  neck_upper_bending: {joint: craniovertebral, positive: head_right_bending, negative: head_left_bending}
  neck_upper_rotation: {joint: craniovertebral, positive: head_left_rotation, negative: head_right_rotation}
  arm_flex_r: {joint: shoulder_r, positive: shoulder_flexion_r, negative: shoulder_extension_r}
  arm_add_r: {joint: shoulder_r, positive: shoulder_adduction_r, negative: shoulder_abduction_r}
  arm_rot_r: {joint: shoulder_r, positive: shoulder_internal_rotation_r, negative: shoulder_external_rotation_r}
  elbow_flex_r: {joint: elbow_r, positive: elbow_flexion_r, negative: elbow_extension_r}
  pro_sup_r: {joint: radioulnar_r, positive: forearm_pronation_r, negative: forearm_supination_r}
  wrist_flex_r: {joint: wrist_r, positive: wrist_flexion_r, negative: wrist_extension_r}
  wrist_dev_r: {joint: wrist_r, positive: wrist_ulnar_deviation_r, negative: wrist_radial_deviation_r}

actions:
  hip_flexion_r: {name: hip flexion, commonName: lifting the thigh forward}
  hip_extension_r: {name: hip extension, commonName: driving the thigh back}
  hip_adduction_r: {name: hip adduction, commonName: drawing the thigh inward}
  hip_abduction_r: {name: hip abduction, commonName: moving the thigh out to the side}
  hip_internal_rotation_r: {name: hip internal rotation, commonName: turning the thigh inward}
  hip_external_rotation_r: {name: hip external rotation, commonName: turning the thigh outward}
  knee_flexion_r: {name: knee flexion, commonName: bending the knee}
  knee_extension_r: {name: knee extension, commonName: straightening the knee}
  ankle_dorsiflexion_r: {name: ankle dorsiflexion, commonName: lifting the toes toward the shin}
  ankle_plantarflexion_r: {name: ankle plantarflexion, commonName: pointing the foot}
  lumbar_extension: {name: lumbar extension, commonName: arching the lower back}
  lumbar_flexion: {name: lumbar flexion, commonName: bending the lower back forward}
  lumbar_right_bending: {name: lumbar lateral flexion to the right, commonName: side-bending the trunk to the right}
  lumbar_left_bending: {name: lumbar lateral flexion to the left, commonName: side-bending the trunk to the left}
  lumbar_left_rotation: {name: lumbar rotation to the left, commonName: turning the trunk to the left}
  lumbar_right_rotation: {name: lumbar rotation to the right, commonName: turning the trunk to the right}
  neck_extension: {name: neck extension, commonName: tilting the neck back}
  neck_flexion: {name: neck flexion, commonName: bending the neck forward}
  neck_right_bending: {name: neck lateral flexion to the right, commonName: tilting the neck to the right}
  neck_left_bending: {name: neck lateral flexion to the left, commonName: tilting the neck to the left}
  neck_left_rotation: {name: neck rotation to the left, commonName: turning the neck to the left}
  neck_right_rotation: {name: neck rotation to the right, commonName: turning the neck to the right}
  head_extension: {name: head extension, commonName: tipping the chin up}
  head_flexion: {name: head flexion, commonName: nodding the chin down}
  head_right_bending: {name: head lateral flexion to the right, commonName: tipping the head to the right}
  head_left_bending: {name: head lateral flexion to the left, commonName: tipping the head to the left}
  head_left_rotation: {name: head rotation to the left, commonName: turning the head to the left}
  head_right_rotation: {name: head rotation to the right, commonName: turning the head to the right}
  shoulder_flexion_r: {name: shoulder flexion, commonName: swinging the arm forward}
  shoulder_extension_r: {name: shoulder extension, commonName: swinging the arm back}
  shoulder_adduction_r: {name: shoulder adduction, commonName: drawing the arm to the side of the body}
  shoulder_abduction_r: {name: shoulder abduction, commonName: raising the arm out to the side}
  shoulder_internal_rotation_r: {name: shoulder internal rotation, commonName: turning the arm inward}
  shoulder_external_rotation_r: {name: shoulder external rotation, commonName: turning the arm outward}
  elbow_flexion_r: {name: elbow flexion, commonName: bending the elbow}
  elbow_extension_r: {name: elbow extension, commonName: straightening the elbow}
  forearm_pronation_r: {name: forearm pronation, commonName: turning the palm down}
  forearm_supination_r: {name: forearm supination, commonName: turning the palm up}
  wrist_flexion_r: {name: wrist flexion, commonName: bending the wrist toward the palm}
  wrist_extension_r: {name: wrist extension, commonName: bending the wrist back}
  wrist_ulnar_deviation_r: {name: wrist ulnar deviation, commonName: tilting the hand toward the little finger}
  wrist_radial_deviation_r: {name: wrist radial deviation, commonName: tilting the hand toward the thumb}

groups:
  gluteals_r: {name: gluteal muscles, commonName: glutes, ontologyName: gluteal muscle}
  iliopsoas_r: {name: iliopsoas, commonName: deep hip flexors}
  adductors_r: {name: adductor muscles of the hip, commonName: inner-thigh muscles, ontologyName: adductor muscle of hip}
  quadriceps_r: {name: quadriceps femoris, commonName: quads}
  hamstrings_r: {name: hamstrings, commonName: hamstrings, ontologyName: hamstring muscle, fmaName: set of hamstring muscles}
  deepHipRotators_r: {name: deep lateral rotators of the hip, commonName: deep hip rotators, ontologyName: lateral rotator muscles of hip}
  anteriorThigh_r: {name: anterior compartment of the thigh, commonName: front of the thigh, ontologyName: muscle of anterior compartment of hindlimb stylopod, fmaName: anterior compartment of right thigh}
  tricepsSurae_r: {name: triceps surae, commonName: calf}
  anteriorLeg_r: {name: anterior compartment of the leg, commonName: shin muscles, ontologyName: anterior compartment of leg, fmaName: anterior compartment of right leg}
  lateralLeg_r: {name: lateral compartment of the leg, commonName: outer-shin muscles, ontologyName: lateral compartment of leg, fmaName: set of muscles of lateral compartment of right leg}
  deepPosteriorLeg_r: {name: deep posterior compartment of the leg, commonName: deep calf muscles, ontologyName: deep posterior compartment of leg, fmaName: deep part of posterior compartment of right leg}
  # Trunk: a group per named muscle gathers its FBLS fascicles.
  multifidus_r: {name: multifidus, commonName: deep back muscle}
  longissimus_r: {name: longissimus thoracis, commonName: long back muscle}
  iliocostalis_r: {name: iliocostalis lumborum, commonName: outer back muscle}
  erectorSpinae_r: {name: erector spinae, commonName: back straighteners, ontologyName: erector spinae muscle group}
  transversospinales_r: {name: transversospinales, commonName: deep spine rotators, ontologyName: transversospinales muscle, fmaName: transversospinales muscle group}
  quadratusLumborum_r: {name: quadratus lumborum, commonName: deep side-of-back muscle}
  externalOblique_r: {name: external oblique, commonName: outer side abdominal}
  internalOblique_r: {name: internal oblique, commonName: inner side abdominal}
  rectusAbdominis_r: {name: rectus abdominis, commonName: six-pack muscle}
  abdominals_r: {name: muscles of the anterior abdominal wall, commonName: abdominals, ontologyName: anterior abdominal wall muscle}
  latissimusDorsi_r: {name: latissimus dorsi, commonName: lats}
  # Arm.
  deltoidMuscle_r: {name: deltoid, commonName: shoulder cap muscle}
  rotatorCuff_r: {name: rotator cuff, commonName: rotator cuff}
  scapulohumeral_r: {name: scapulohumeral muscles, commonName: shoulder-blade-to-arm muscles}
  pectoralisMajor_r: {name: pectoralis major, commonName: pecs}
  bicepsBrachii_r: {name: biceps brachii, commonName: biceps}
  tricepsBrachii_r: {name: triceps brachii, commonName: triceps}
  anteriorArm_r: {name: anterior compartment of the arm, commonName: front of the upper arm, ontologyName: anterior compartment of arm, fmaName: anterior compartment of right arm}
  posteriorArm_r: {name: posterior compartment of the arm, commonName: back of the upper arm, ontologyName: posterior compartment of arm, fmaName: posterior compartment of right arm}
  anteriorForearm_r: {name: anterior compartment of the forearm, commonName: forearm flexors, ontologyName: anterior compartment of forearm, fmaName: anterior compartment of right forearm}
  posteriorForearm_r: {name: posterior compartment of the forearm, commonName: forearm extensors, ontologyName: posterior compartment of forearm, fmaName: posterior compartment of right forearm}
  flexorDigitorumSuperficialis_r: {name: flexor digitorum superficialis, commonName: finger curler}
  flexorDigitorumProfundus_r: {name: flexor digitorum profundus, commonName: deep finger curler}
  extensorDigitorum_r: {name: extensor digitorum, commonName: finger straightener}
  # Neck.
  sternocleidomastoid_r: {name: sternocleidomastoid, commonName: SCM}
  scalenes_r: {name: scalene muscles, commonName: scalenes, ontologyName: scalene muscle}
  longusColli_r: {name: longus colli, commonName: deep front neck muscle}
  prevertebral_r: {name: prevertebral muscles of the neck, commonName: deep front neck muscles, ontologyName: prevertebral muscle}
  trapezius_r: {name: trapezius, commonName: traps}
