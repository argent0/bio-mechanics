  hypoglossal_r: {name: C1 fibres of the hypoglossal nerve, commonName: cranial nerve XII, ontologyName: hypoglossal nerve}
  mylohyoidNerve_r: {name: nerve to mylohyoid, ontologyName: mylohyoid nerve}
  facial_r: {name: facial nerve, commonName: cranial nerve VII}

# Ligaments and the joints they stabilise.
