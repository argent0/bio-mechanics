# Role-classification thresholds of stage labelRoles (decision D-002 in DECISIONS.md).
# The meaning of each key, and the rule that reads it, live in pipeline/label_roles.py
# (`Config`); roles.json records these values.

# A muscle counts toward the action (agonist) or against it (opposing) at a frame when its
# moment arm about the action's coordinate reaches this magnitude, in metres.
momentArmMinM: 0.005
# Share of the total agonist moment over the phase: main mover from this share up.
mainMoverMinShare: 0.25
# Share of the total agonist moment over the phase: helper from this share up to the main mover's.
helperMinShare: 0.05
# Share of the total opposing moment over the phase: antagonist from this share up.
antagonistMinShare: 0.05
# Main mover, helper, antagonist (decision D-006, which replaces D-004 and D-005): the mean
# activation over the phase reaches roleMinActivation, and either reaches roleClearActivation
# or reaches roleMinPeakFraction of the muscle's own peak activation over the stride; otherwise
# the muscle is inactive for the action in the phase.
roleMinActivation: 0.015
roleClearActivation: 0.05
roleMinPeakFraction: 0.25
# Stabiliser: mean activation over the phase from this value up ...
stabiliserMinActivation: 0.10
# ... while the coordinate changes by less than this over the phase, in degrees.
stabiliserMaxChangeDeg: 5.0
# Contraction: activation-weighted mean muscle-tendon velocity over the phase, in m/s; a
# magnitude below this is isometric, below zero concentric, above zero eccentric.
isometricMaxVelocity: 0.01

# Sampling of the curves in roles.json and graph.json.
samplesPerPhase: 21
samplesPerStride: 51

# The muscles labelled (decision D-007): every muscle whose name ends in a side suffix, on both
# sides, takes its roles per phase of the reference leg's seven phases.
muscleSuffixes: ["_r", "_l"]
# The joint coordinates whose actions are labelled. A coordinate ending in a muscle suffix takes
# the muscles of that side; a midline coordinate (lumbar, neck) takes the muscles of both sides
# (pipeline/label_roles.py `muscles_of`). The legs' subtalar and metatarsophalangeal coordinates
# are locked in the model and carry no moment arms. The neck coordinates rest on decision
# D-010 (the head held level in space).
coordinates:
  - hip_flexion_r
  - hip_adduction_r
  - hip_rotation_r
  - knee_angle_r
  - ankle_angle_r
  - hip_flexion_l
  - hip_adduction_l
  - hip_rotation_l
  - knee_angle_l
  - ankle_angle_l
  - lumbar_extension
  - lumbar_bending
  - lumbar_rotation
  - neck_lower_extension
  - neck_lower_bending
  - neck_lower_rotation
  - neck_upper_extension
  - neck_upper_bending
  - neck_upper_rotation
  - arm_flex_r
  - arm_add_r
  - arm_rot_r
  - elbow_flex_r
  - pro_sup_r
  - wrist_flex_r
  - wrist_dev_r
  - arm_flex_l
  - arm_add_l
  - arm_rot_l
  - elbow_flex_l
  - pro_sup_l
  - wrist_flex_l
  - wrist_dev_l
