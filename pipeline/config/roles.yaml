# Role-classification thresholds of stage labelRoles (decision D-002 in DECISIONS.md).
# The meaning of each key, and the rule that reads it, live in pipeline/label_roles.py
# (`Config`); roles.json records these values.

# A muscle counts toward the action (agonist) or against it (opposing) at a frame when its
# moment arm about the action's coordinate reaches this magnitude, in metres.
momentArmMinM: 0.005
# Share of the total agonist moment over the phase: main mover from this share up.
mainMoverMinShare: 0.25
# Share of the total agonist moment over the phase: helper from this share up to the main mover's.
helperMinShare: 0.05
# Share of the total opposing moment over the phase: antagonist from this share up.
antagonistMinShare: 0.05
# Main mover, helper, antagonist: mean activation over the phase from this fraction of the
# muscle's own peak activation over the stride up (decision D-005, which replaces D-004);
# below it the muscle is inactive for the action in the phase.
roleMinPeakFraction: 0.25
# Stabiliser: mean activation over the phase from this value up ...
stabiliserMinActivation: 0.10
# ... while the coordinate changes by less than this over the phase, in degrees.
stabiliserMaxChangeDeg: 5.0
# Contraction: activation-weighted mean muscle-tendon velocity over the phase, in m/s; a
# magnitude below this is isometric, below zero concentric, above zero eccentric.
isometricMaxVelocity: 0.01

# Sampling of the curves in roles.json and graph.json.
samplesPerPhase: 21
samplesPerStride: 51

# The reference leg: its muscles end in this suffix.
muscleSuffix: "_r"
# The joint coordinates whose actions are labelled (lower body, right leg). The subtalar and
# metatarsophalangeal coordinates are locked in the scaled model and carry no moment arms.
coordinates:
  - hip_flexion_r
  - hip_adduction_r
  - hip_rotation_r
  - knee_angle_r
  - ankle_angle_r
